name: CI pancake-simulator 

on: 
  push:
    paths: 
      - "pancake-simulator/**"
      - "**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3 
    
      - name: Build Simulate Images 
        run: docker build -t pancake-simulator ./pancake-simulator
      
      - name: Build Gateway Image
        run: docker build -t gateway-test .
      
      - name: Create Network
        run: docker network create ci-test-net
      
      - name: Docker run gateway
        run: |
          docker run -d --name gateway-test-ci --network ci-test-net \
            -e KAFKA_BOOTSTRAP_SERVERS="kafka:9094" \
            -e PANCAKE_WEBHOOK_SECRET="ci-test-secret" \
            -e PANCAKE_RAW_TOPIC="pancake.raw" \
            gateway-test
      
      
      - name: Docker run pancake-simulator
        run: |
          docker run -d --name pancake-simulator-ci --network ci-test-net \
            -p 8001:8001 \
            -e GATEWAY_URL="http://gateway-test-ci:8000/webhooks/pancake/ci-test-secret"\
            pancake-simulator
      
      - name: Run test healthz pancake simulate
        run: |
          sleep 5
          curl -f "http://localhost:8001/healthz"

      - name: Run test Pancake to gateway
        run: |
          sleep 5
          response=$(curl -f -X POST "http://localhost:8001/simulate?count=2")
          echo "$response" | jq -e '[.results[].status_code] | all(. == 200)'

  publish-and-deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push gateway/consumer image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/pancake-streaming-ingestion-gateway:latest \
                        -t ghcr.io/${{ github.repository_owner }}/pancake-streaming-ingestion-gateway:${{ github.sha }} .
          docker push ghcr.io/${{ github.repository_owner }}/pancake-streaming-ingestion-gateway:latest
          docker push ghcr.io/${{ github.repository_owner }}/pancake-streaming-ingestion-gateway:${{ github.sha }}

      - name: Build and push pancake-simulator image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/pancake-streaming-ingestion-simulator:latest \
                        -t ghcr.io/${{ github.repository_owner }}/pancake-streaming-ingestion-simulator:${{ github.sha }} ./pancake-simulator
          docker push ghcr.io/${{ github.repository_owner }}/pancake-streaming-ingestion-simulator:latest
          docker push ghcr.io/${{ github.repository_owner }}/pancake-streaming-ingestion-simulator:${{ github.sha }}

      - name: Trigger Coolify deploy
        run: |
          curl --fail -X GET "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"